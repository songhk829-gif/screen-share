<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screen Share</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
body{font-family:system-ui;background:#0f172a;color:#fff;margin:0;padding:20px}
.card{background:#1e293b;border-radius:16px;padding:18px;max-width:500px;margin:auto}
.btn{width:100%;padding:14px;border-radius:10px;border:0;font-weight:700;margin-top:10px}
.btn-primary{background:#38bdf8;color:#000}
.btn-dark{background:#334155;color:#fff}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;box-sizing:border-box;margin-top:10px}
video{width:100%;border-radius:12px;background:#000;margin-top:12px}
.small{font-size:12px;color:#94a3b8;margin-top:8px;word-break:break-all}
</style>
</head>
<body>
<div class="card">
<h2>📺 Live Screen Share</h2>
<div id="setup">
<button class="btn btn-primary" id="shareBtn">Start Sharing My Screen</button>
<div style="text-align:center;margin:12px;color:#64748b">— OR —</div>
<input id="peerIdInput" placeholder="Paste Host ID to view">
<button class="btn btn-dark" id="viewBtn">View Screen</button>
</div>
<div id="hostView" style="display:none">
<p class="small">Share this ID / Link:</p>
<input id="myId" readonly>
<button class="btn btn-dark" id="copyBtn">Copy Link</button>
<div class="small" id="hostLink"></div>
<video id="preview" autoplay muted playsinline></video>
<p class="small" id="hostStatus">Waiting for viewer...</p>
</div>
<div id="viewerView" style
